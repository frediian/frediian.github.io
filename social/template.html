<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1080, initial-scale=1">
  <title>frediian · Servicio para compartir</title>
  <style>
    @font-face{font-family:Manrope;font-weight:200 800;font-display:block;src:url('/assets/fonts/manrope-variable.ttf') format('truetype')}
    @font-face{font-family:'DM Sans';font-weight:100 1000;font-display:block;src:url('/assets/fonts/dm-sans-variable.ttf') format('truetype')}
    *{box-sizing:border-box}
    html,body{margin:0;width:1080px;height:1920px;overflow:hidden}
    body{background:#081e2d;color:#fff;font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased}
    .poster{position:absolute;inset:24px;border:1px solid #395870;border-radius:48px;overflow:hidden;background:linear-gradient(155deg,#153e5b 0%,#102f46 46%,#0a2233 100%)}
    .poster::before{content:'';position:absolute;inset:0;background-image:radial-gradient(#51cde52b 1.5px,transparent 1.5px);background-size:28px 28px;mask-image:linear-gradient(90deg,transparent 30%,black);opacity:.75;pointer-events:none}
    .poster::after{content:'';position:absolute;width:240px;height:4px;top:48px;left:64px;border-radius:4px;background:#51cde5}
    .content{position:relative;height:100%;padding:96px 64px 116px;display:flex;flex-direction:column}
    .brand-row{display:flex;align-items:center;justify-content:space-between;gap:24px}
    .brand-logo svg{display:block;width:340px;height:95px}
    .edition{font-size:21px;letter-spacing:1.5px;padding:12px 18px;border-radius:100px;color:#b8d7e5;border:1px solid #6a8da655;white-space:nowrap}
    .slogan{color:#bad1df;font-size:26px;line-height:1.5;margin:11px 0 0;letter-spacing:-.2px}
    .story{margin-top:48px}
    .service-heading{display:flex;align-items:center;gap:21px;margin-bottom:27px}
    .service-icon{display:grid;place-items:center;flex:none;width:78px;height:78px;border:1px solid #51cde550;border-radius:20px;background:#1d4d6d}
    .service-icon svg{width:45px;height:45px}
    .service-icon svg g{stroke:#51cde5}
    .category{font-size:25px;font-weight:650;color:#c8e4ef;text-transform:uppercase;letter-spacing:1.9px;line-height:1.45}
    h1{font-family:Manrope,sans-serif;font-size:64px;font-weight:800;line-height:1.12;letter-spacing:-2.5px;margin:0;max-width:880px}
    .solution-label{display:flex;align-items:center;gap:12px;margin:33px 0 12px;color:#51cde5;font-size:22px;font-weight:650;letter-spacing:1.8px}
    .solution-label::before{content:'';height:8px;width:8px;background:#f6aa71;border-radius:50%;flex:none}
    .benefit{font-family:Manrope,sans-serif;font-size:40px;font-weight:650;line-height:1.3;letter-spacing:-.9px;margin:0;color:#d6f4fa}
    .benefits{display:flex;flex-direction:column;gap:11px;padding:0;margin:28px 0 0;list-style:none}
    .benefits li{display:flex;align-items:center;gap:18px;padding:17px 21px;border:1px solid #4d75904d;border-radius:13px;background:#ffffff06;color:#eef8fc;font-size:30px;line-height:1.35}
    .tick{display:grid;place-items:center;flex:none;width:32px;height:32px;border-radius:50%;background:#51cde51a;color:#51cde5;font-size:23px}
    .scope-note{font-size:24px;line-height:1.5;margin:23px 0 0;color:#b9d0de;letter-spacing:-.1px}
    .spacer{flex:1;min-height:28px}
    .cta-panel{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:27px 29px;background:#fafbfc;border-radius:22px;color:#102f46;min-height:268px}
    .cta-copy{flex:1;min-width:0}
    .cta-kicker{font-size:21px;line-height:1.4;letter-spacing:1.5px;font-weight:700;text-transform:uppercase;color:#17699a;margin:0 0 12px}
    .cta-title{font-family:Manrope,sans-serif;font-weight:800;font-size:35px;line-height:1.22;letter-spacing:-1px;margin:0 0 14px}
    .website{display:inline-flex;align-items:center;gap:15px;font-weight:700;font-size:29px;line-height:1.4;color:#17699a}
    .website::after{content:'↗';font-weight:400;font-size:31px}
    .qr-block{text-align:center;flex:none}
    .qr-block img{display:block;image-rendering:pixelated;margin:auto}
    .qr-block p{font-size:20px;line-height:1.3;color:#536978;margin:7px 0 0}
    .coverage{display:flex;justify-content:space-between;gap:20px;align-items:center;color:#b9d0de;font-size:23px;line-height:1.4;margin-top:23px}
    .coverage strong{font-weight:550;color:#d9e9f1}
    .coverage span:last-child{display:flex;align-items:center;gap:10px}
    .coverage span:last-child::before{content:'';height:6px;width:6px;background:#f6aa71;border-radius:50%}
  </style>
</head>
<body>
  <article class="poster" aria-label="Servicio de frediian para compartir">
    <div class="content">
      <header data-safe="true">
        <div class="brand-row"><div class="brand-logo">{{LOGO}}</div><span class="edition">DESARROLLO + TI</span></div>
        <p class="slogan">Tecnología que resuelve, tú avanzas.</p>
      </header>
      <div class="story" data-safe="true">
        <div class="service-heading"><span class="service-icon">{{ICON}}</span><span class="category">{{TITLE}}</span></div>
        <h1>{{HOOK}}</h1>
        <p class="solution-label">UNA SOLUCIÓN A TU MEDIDA</p>
        <p class="benefit">{{BENEFIT}}</p>
        <ul class="benefits">{{BULLETS}}</ul>
        <p class="scope-note">{{NOTE}}</p>
      </div>
      <div class="spacer"></div>
      <section class="cta-panel" data-safe="true" aria-label="Contacto">
        <div class="cta-copy"><p class="cta-kicker">HABLEMOS DE TU PROYECTO</p><h2 class="cta-title">{{CTA}}</h2><span class="website">frediian.dev</span></div>
        <div class="qr-block"><img src="{{QR}}" width="{{QR_SIZE}}" height="{{QR_SIZE}}" alt="Código QR del servicio"><p>Escanea y consulta</p></div>
      </section>
      <footer class="coverage" data-safe="true"><span><strong>Loja, Ecuador</strong></span><span>Atención en todo el país</span></footer>
    </div>
  </article>
</body>
</html>
